openapi: 3.1.0
info:
  title: Kusanya service API
  version: 0.0.0
  description: >-
    Operational probes and the mounted tenant-bound administrator publication
    surface. Collector, submission and OpenRosa APIs are not implemented.
    Request parsing errors retain integer 4xx HTTP statuses (including 400, 413
    and 415) with only {"error":"Request rejected"}. Other unhandled errors
    return 500 with only {"error":"Internal server error"}. Error responses
    use Cache-Control no-store and do not reflect request or internal details.
    Unsupported routes return 404 unless request parsing rejects them first.
paths:
  /admin:
    get:
      operationId: getAdministratorInterface
      summary: Load the self-contained administrator operator interface
      responses:
        '200':
          description: Static HTML shell; no tenant data or credential is embedded
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Content-Security-Policy:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
  /healthz:
    get:
      operationId: getLiveness
      summary: Process is accepting requests, independent of PostgreSQL
      responses:
        '200':
          description: Alive
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
    head:
      operationId: headLiveness
      responses:
        '200':
          description: Alive; no response body
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
  /readyz:
    get:
      operationId: getReadiness
      summary: PostgreSQL answers SELECT 1 within configured timeouts
      responses:
        '200':
          description: Ready
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          description: PostgreSQL unavailable; no connection details returned
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: unavailable }
    head:
      operationId: headReadiness
      responses:
        '200':
          description: Ready; no response body
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        '503':
          description: PostgreSQL unavailable; no response body
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
  /api/admin/session/login:
    post:
      operationId: createAdministratorSession
      summary: Exchange one verified OIDC API access token for an opaque administrator session
      security: [{ oidcAccessToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      requestBody:
        required: false
        description: Present only while atomically accepting a first-sign-in invitation
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitationToken]
              properties:
                invitationToken:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '204':
          description: Session issued; response body is empty
          headers:
            Set-Cookie:
              description: Secure HttpOnly host-only SameSite=Lax administrator session
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/session/csrf:
    post:
      operationId: getAdministratorCsrf
      summary: Return the CSRF value derived from one live administrator session
      security: [{ administratorSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      responses:
        '200':
          description: Session-derived CSRF value
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrfToken]
                properties:
                  csrfToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/session/logout:
    post:
      operationId: revokeAdministratorSession
      summary: Revoke the live session before clearing its host-only cookie
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      responses:
        '204':
          description: Session revoked and cookie expired; response body is empty
          headers:
            Set-Cookie:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/administrators:
    delete:
      operationId: deprovisionTenantAdministrator
      summary: Revoke one OIDC subject's access to the live administrator's tenant
      description: Requires the caller's live role to be administrator
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject]
              properties:
                subject: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '204':
          description: Subject deactivated, audited and all of its sessions revoked
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: changeTenantAdministratorRole
      summary: Change one peer administrator role without changing its tenant binding
      description: Requires the caller's live role to be administrator
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, role]
              properties:
                subject: { type: string, minLength: 1, maxLength: 512 }
                role:
                  type: string
                  enum: [administrator, publisher, reviewer]
      responses:
        '204':
          description: Peer role changed and audited; response body is empty
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/administrator-invitations:
    post:
      operationId: createTenantAdministratorInvitation
      summary: Issue one expiring single-use invitation without probing global membership
      description: Requires the caller's live role to be administrator
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, role]
              properties:
                subject: { type: string, minLength: 1, maxLength: 512 }
                role:
                  type: string
                  enum: [administrator, publisher, reviewer]
      responses:
        '201':
          description: Invitation issued; its raw token is returned only in this response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitationId, invitationToken, expiresInSeconds]
                properties:
                  invitationId:
                    type: string
                    format: uuid
                    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
                  invitationToken:
                    type: string
                    pattern: '^[A-Za-z0-9_-]{43}$'
                  expiresInSeconds:
                    type: integer
                    minimum: 300
                    maximum: 604800
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: revokeTenantAdministratorInvitation
      summary: Idempotently revoke a pending invitation in the live tenant
      description: Requires the caller's live role to be administrator
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitationId]
              properties:
                invitationId:
                  type: string
                  format: uuid
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '204':
          description: Pending invitation revoked if present; response body is empty
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/salesforce/authorization:
    post:
      operationId: startTenantSalesforceAuthorization
      summary: Begin one administrator-bound Salesforce authorization grant
      description: >-
        Administrator only. The request has no body, query or tenant selector.
        The redirect and browser-binding cookie contain no refresh token.
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      responses:
        '303':
          description: Redirect to the tenant's configured Salesforce authorization origin
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: Secure HttpOnly host-only SameSite=Lax one-time browser binding
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/salesforce/callback:
    get:
      operationId: completeTenantSalesforceAuthorization
      summary: Complete the one-time Salesforce authorization callback
      description: >-
        Requires the exact still-live initiating administrator session and its
        one-time browser binding. Supply exactly state plus either code or error;
        an optional error_description is discarded and never reflected or logged.
      security: [{ administratorSession: [], oauthBrowserBinding: [] }]
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: error
          in: query
          required: false
          schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,256}$' }
        - name: error_description
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: Encrypted tenant connection and authorization audit committed atomically
          headers:
            Set-Cookie:
              description: Expires the one-time browser-binding cookie
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: connected }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/salesforce/publications:
    post:
      operationId: publishSalesforceDefinition
      summary: Publish one tenant-bound Salesforce Form Version
      description: Requires the caller's live role to be administrator or publisher
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [formVersionId]
              properties:
                formVersionId:
                  type: string
                  pattern: '^[A-Za-z0-9]{15}([A-Za-z0-9]{3})?$'
      responses:
        '200':
          description: Publication committed or already committed
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '409':
          description: Partial or unresolved outcome requiring reconciliation
        '422':
          description: Publication rejected with bounded diagnostics
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/salesforce/publication-attempts:
    get:
      operationId: listPublicationAttempts
      summary: List the newest 100 tenant-scoped publication attempts read-only
      description: Available to administrator, publisher and reviewer roles
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor returned by the previous page
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{86}$'
      responses:
        '200':
          description: Least-data operator presentation
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attempts, nextCursor]
                properties:
                  attempts:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/PublicationAttemptSummary'
                  nextCursor:
                    anyOf:
                      - { type: string, pattern: '^[A-Za-z0-9_-]{86}$' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/publication-attempts/retention:
    post:
      operationId: applyPublicationAttemptRetention
      summary: Delete one bounded batch selected by the tenant retention policy
      description: >-
        Administrator only. Accepts no body, query, tenant, cutoff or attempt ID.
        Started, unresolved, indeterminate and unlinked-artifact attempts are never
        eligible. Each deleted attempt receives a surviving audit in the same
        database transaction.
      security: [{ administratorSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ExactOrigin'
      responses:
        '200':
          description: Policy applied to at most 100 eligible attempts
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deletedCount]
                properties:
                  deletedCount: { type: integer, minimum: 0, maximum: 100 }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Rejected' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    oidcAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token issued for the Kusanya API; never persisted
    administratorSession:
      type: apiKey
      in: cookie
      name: __Host-kusanya_admin_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    oauthBrowserBinding:
      type: apiKey
      in: cookie
      name: __Host-kusanya_oauth_binding
  parameters:
    ExactOrigin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
      description: Must exactly equal the configured HTTPS application origin
  responses:
    Rejected:
      description: Request rejected without reflecting supplied data
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FixedError' }
    AuthenticationRequired:
      description: A live administrator session is required
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FixedError' }
    Unavailable:
      description: Operation unavailable without internal details
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FixedError' }
  schemas:
    FixedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    PublicationAttemptSummary:
      type: object
      additionalProperties: false
      required:
        [
          attemptId,
          formVersionId,
          operatorStatus,
          startedAt,
          completedAt,
          reconciledAt,
        ]
      properties:
        attemptId: { type: string, format: uuid }
        formVersionId: { type: string }
        operatorStatus:
          type: string
          enum:
            - human_judgement_required_unresolved
            - human_judgement_required_indeterminate
            - published
            - rejected
            - published_confirmed
            - unlinked_artifacts_confirmed
            - artifacts_missing_confirmed
        startedAt: { type: string, format: date-time }
        completedAt:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
        reconciledAt:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
